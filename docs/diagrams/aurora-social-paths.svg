<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Социальные пути к вечеринке Aurora</title>
  <desc id="desc">Три системных маршрута от игрока к закрытой вечеринке Aurora: через друзей сотрудников, прессу и подрядчиков. Связи необходимо открыть через знания и действия.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111a31"/></linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6ea8fe"/></marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4ee1c1"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd166"/></marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#f7f8fc}
      .subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#aab3c5}
      .node{fill:#151e34;stroke:#33405e;stroke-width:2}
      .person{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#f7f8fc;text-anchor:middle}
      .role{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#aab3c5;text-anchor:middle}
      .route{font:700 15px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}
      .edge1{stroke:#6ea8fe;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}
      .edge2{stroke:#4ee1c1;stroke-width:3;fill:none;marker-end:url(#arrowTeal)}
      .edge3{stroke:#ffd166;stroke-width:3;fill:none;marker-end:url(#arrowGold)}
    </style>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="54" y="64" class="title">Aurora Party: три системных социальных пути</text>
  <text x="54" y="96" class="subtitle">Игрок видит не всю схему сразу — связи становятся доступны через разговоры, доверие и услуги</text>

  <rect x="44" y="270" width="150" height="92" rx="20" fill="#202746" stroke="#8eb8ff" stroke-width="2"/>
  <text x="119" y="309" class="person">PLAYER</text>
  <text x="119" y="336" class="role">знает только Anna</text>

  <rect x="1007" y="270" width="150" height="92" rx="20" fill="#342033" stroke="#ff7a8a" stroke-width="2"/>
  <text x="1082" y="306" class="person">AURORA</text>
  <text x="1082" y="330" class="person">PARTY</text>
  <text x="1082" y="350" class="role">закрытое событие</text>

  <text x="232" y="139" class="route" fill="#8eb8ff">ПУТЬ ДОВЕРИЯ</text>
  <rect x="232" y="154" width="150" height="72" rx="16" class="node"/><text x="307" y="184" class="person">Anna</text><text x="307" y="207" class="role">друг игрока</text>
  <rect x="446" y="154" width="150" height="72" rx="16" class="node"/><text x="521" y="184" class="person">Sergey</text><text x="521" y="207" class="role">Aurora engineer</text>
  <rect x="660" y="154" width="150" height="72" rx="16" class="node"/><text x="735" y="184" class="person">Maria</text><text x="735" y="207" class="role">организатор</text>
  <path d="M194 300C210 300 210 190 222 190" class="edge1"/><path d="M382 190H436" class="edge1"/><path d="M596 190H650" class="edge1"/><path d="M810 190C930 190 930 292 997 304" class="edge1"/>

  <text x="232" y="305" class="route" fill="#4ee1c1">ПУТЬ ПРЕССЫ</text>
  <rect x="232" y="320" width="150" height="72" rx="16" class="node"/><text x="307" y="350" class="person">Daniel</text><text x="307" y="373" class="role">журналист</text>
  <rect x="446" y="320" width="150" height="72" rx="16" class="node"/><text x="521" y="350" class="person">Daria</text><text x="521" y="373" class="role">PR manager</text>
  <rect x="660" y="320" width="150" height="72" rx="16" class="node"/><text x="735" y="350" class="person">Maria</text><text x="735" y="373" class="role">организатор</text>
  <path d="M194 316H222" class="edge2"/><path d="M382 356H436" class="edge2"/><path d="M596 356H650" class="edge2"/><path d="M810 356H997" class="edge2"/>

  <text x="232" y="471" class="route" fill="#ffd166">ПУТЬ ПОДРЯДЧИКОВ</text>
  <rect x="232" y="486" width="130" height="72" rx="16" class="node"/><text x="297" y="516" class="person">Oleg</text><text x="297" y="539" class="role">бариста</text>
  <rect x="402" y="486" width="130" height="72" rx="16" class="node"/><text x="467" y="516" class="person">Irina</text><text x="467" y="539" class="role">catering</text>
  <rect x="572" y="486" width="130" height="72" rx="16" class="node"/><text x="637" y="516" class="person">Pavel</text><text x="637" y="539" class="role">contractor</text>
  <rect x="742" y="486" width="130" height="72" rx="16" class="node"/><text x="807" y="516" class="person">Maria</text><text x="807" y="539" class="role">организатор</text>
  <path d="M194 332C210 332 210 522 222 522" class="edge3"/><path d="M362 522H392" class="edge3"/><path d="M532 522H562" class="edge3"/><path d="M702 522H732" class="edge3"/><path d="M872 522C950 522 950 344 997 328" class="edge3"/>

  <rect x="232" y="598" width="640" height="38" rx="19" fill="#151e34" stroke="#33405e"/>
  <text x="552" y="623" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#d6dbea">REFUSE и NEGOTIATE меняют обстоятельства, а не закрывают квест</text>
</svg>
