<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Social Rendering pipeline</title>
  <desc id="desc">Поток от состояния мира и решения NPC к структурированному коммуникативному акту, рендерингу через шаблон или Groq и видимой игроку реплике. LLM не изменяет мир.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a31"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6ea8fe"/>
    </marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#f7f8fc}
      .subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#aab3c5}
      .step{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#f7f8fc;text-anchor:middle}
      .meta{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#aab3c5;text-anchor:middle}
      .lane{font:700 15px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}
      .card{fill:#151e34;stroke:#33405e;stroke-width:2}
      .arrow{stroke:#6ea8fe;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="54" y="64" class="title">Social Rendering</text>
  <text x="54" y="96" class="subtitle">Симуляция решает «что и почему», языковая модель — только «как это выразить»</text>

  <rect x="42" y="176" width="160" height="126" rx="18" class="card"/>
  <circle cx="122" cy="201" r="8" fill="#4ee1c1"/>
  <text x="122" y="236" class="step">WORLD</text>
  <text x="122" y="264" class="meta">факты · связи</text>
  <text x="122" y="285" class="meta">знания · события</text>

  <rect x="238" y="176" width="160" height="126" rx="18" class="card"/>
  <circle cx="318" cy="201" r="8" fill="#4ee1c1"/>
  <text x="318" y="232" class="step">SOCIAL</text>
  <text x="318" y="254" class="step">SIMULATION</text>
  <text x="318" y="282" class="meta">preconditions · utility</text>

  <rect x="434" y="176" width="160" height="126" rx="18" class="card"/>
  <circle cx="514" cy="201" r="8" fill="#ffd166"/>
  <text x="514" y="232" class="step">NPC</text>
  <text x="514" y="254" class="step">DECISION</text>
  <text x="514" y="282" class="meta">accept · refuse · negotiate</text>

  <rect x="630" y="176" width="160" height="126" rx="18" class="card"/>
  <circle cx="710" cy="201" r="8" fill="#ffd166"/>
  <text x="710" y="228" class="step">COMMUNICATIVE</text>
  <text x="710" y="252" class="step">ACT</text>
  <text x="710" y="281" class="meta">intent · reason · disclosure</text>

  <rect x="826" y="176" width="160" height="126" rx="18" fill="#18253a" stroke="#4ee1c1" stroke-width="2"/>
  <circle cx="906" cy="201" r="8" fill="#4ee1c1"/>
  <text x="906" y="232" class="step">SOCIAL</text>
  <text x="906" y="254" class="step">RENDERER</text>
  <text x="906" y="282" class="meta">template ↔ Groq</text>

  <rect x="1022" y="176" width="136" height="126" rx="18" fill="#23203a" stroke="#ff7a8a" stroke-width="2"/>
  <circle cx="1090" cy="201" r="8" fill="#ff7a8a"/>
  <text x="1090" y="232" class="step">PLAYER</text>
  <text x="1090" y="254" class="step">OUTPUT</text>
  <text x="1090" y="282" class="meta">реплика · реакция</text>

  <path d="M202 239H228" class="arrow"/>
  <path d="M398 239H424" class="arrow"/>
  <path d="M594 239H620" class="arrow"/>
  <path d="M790 239H816" class="arrow"/>
  <path d="M986 239H1012" class="arrow"/>

  <rect x="42" y="364" width="748" height="72" rx="14" fill="#0e2a29" stroke="#23776b"/>
  <text x="66" y="395" class="lane" fill="#4ee1c1">ДЕТЕРМИНИРОВАННАЯ ЗОНА</text>
  <text x="66" y="420" class="subtitle">истина мира, решения и причины воспроизводимы по seed</text>

  <rect x="826" y="364" width="332" height="72" rx="14" fill="#261d32" stroke="#744b75"/>
  <text x="850" y="395" class="lane" fill="#ff9aac">ТЕКСТОВАЯ ЗОНА</text>
  <text x="850" y="420" class="subtitle">выразить смысл, не придумать его</text>

  <path d="M808 342V468" stroke="#ff7a8a" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="673" y="475" width="270" height="54" rx="27" fill="#321e2b" stroke="#ff7a8a" stroke-width="2"/>
  <text x="808" y="508" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#ff9aac">LLM НЕ ПИШЕТ В WORLD</text>

  <text x="54" y="603" class="subtitle">Fallback: если API недоступен, тот же Communicative Act рендерится шаблоном.</text>
  <rect x="54" y="625" width="1092" height="2" fill="#26324b"/>
</svg>
